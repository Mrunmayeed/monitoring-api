version: "2.1"

orbs:
  docker: circleci/docker@1.8.0

executors:
  custom-docker-executor:
    docker:
      - image: cimg/base:stable

jobs:
  build:
    executor: custom-docker-executor
    steps:
      - checkout
      - setup_remote_docker:
          version: 20.10.7

      - run:
          name: Run Unit Tests with Coverage
          command: |
            mkdir -p test-results
            go test ./... -coverprofile=coverage.out -covermode=atomic -race -v | tee test-results/test-report.txt
      - run:
          name: Generate Coverage Report
          command: |
            go tool cover -html=coverage.out -o coverage.html
      - store_artifacts:
          path: test-results
          destination: test-results
      - store_artifacts:
          path: coverage.out
          destination: coverage/coverage.out
      - store_artifacts:
          path: coverage.html
          destination: coverage/coverage.html
      - run:
          name: Build Docker Image
          command: |
            docker build -t monitoring-api:latest .
      - run:
          name: Push Docker Image to Docker Hub
          command: |
            echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
            docker tag monitoring-api:latest $DOCKER_USERNAME/monitoring-api:latest
            docker push $DOCKER_USERNAME/monitoring-api:latest